{% extends "feed/base.html" %}
{% block content %}
<!-- Display Messages -->
{% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div{% if message.tags %} class="{{ message.tags }}"{% endif %}></div>
        {% endfor %}
    </div>
{% endif %}
<h2 class="custom-title">{{ survey.title }}</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <p class="survey-question-title">{{ field.label_tag }}</p>
        <div class="choices-container">
        {% for choice in field %}
            <!-- <label onmouseover="hover(this)" onmouseout="unhover(this)"> -->
            <label class="choice-button choice-option">
                {{ choice }}
                <!--{{ choice.choice_label }}-->
                <!--{{ choice.tag }}
                <span>{{ choice.choice_label }}</span> -->
            </label><br>
        {% endfor %}
        </div>
    {% endfor %}
    <hr>
    <!--<button type="submit">Submit</button>-->
    <button type="submit" class="btn btn-primary">Submit</button>
    <br>
    <br>
</form>
{% endblock content %}
