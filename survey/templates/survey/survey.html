{% extends "feed/base.html" %}
{% block content %}
<!-- Display Messages -->
{% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div{% if message.tags %} class="{{ message.tags }}"{% endif %}></div>
        {% endfor %}
    </div>
{% endif %}
<h1>{{ survey.title }}</h1>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <p>{{ field.label_tag }}</p>
        {% for choice in field %}
            <label>
                {{ choice }}
                <!-- {{ choice.choice_label }} -->
            </label><br>
        {% endfor %}
    {% endfor %}
    <hr>
    <!--<button type="submit">Submit</button>-->
    <button type="submit" class="btn btn-primary">Submit</button>
    <br>
    <br>
</form>
{% endblock content %}
