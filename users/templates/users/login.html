{% extends "feed/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section">
        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Log In</legend>
                {{ form|crispy }}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit">Login</button>
            </div>
        </form>
        <div class="border-top pt-3">
            <small class="text-muted">
                Forgot Password? <a class="ml-2" href="{% url 'password_reset' %}">Reset Password</a>
            </small>
            <hr>
            <small class="text-muted">
                Need An Account? <a class="ml-2" href="{% url 'register' %}">Sign Up Now</a>
            </small>
        </div>
    </div>
    <!-- Footer Section -->
    <footer style="background-color: #5f788a; color: white; margin-top: 1rem; padding: 0.5rem; text-align: center;">
        <p>Support Email: <a href="mailto:mudatalab@gmail.com" class="text-white">mudatalab@gmail.com</a></p>
        <p>&copy; Data Lab, Marquette University.</p>
    </footer>
{% endblock content %}
